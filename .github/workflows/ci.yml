name: CI

# Runs on every push to main (where App Hosting auto-deploys from) and on PRs.
# App Hosting builds the same commit independently — this gives a fast, clearly
# attributable pass/fail on the commit itself, so a broken build is caught here
# instead of being discovered later as "the deploy isn't working".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    # These NEXT_PUBLIC_* values are public config (identical to apphosting.yaml,
    # already shipped in every page's HTML) — the build needs them defined to
    # prerender. Server-only secrets are read at runtime, not during the build.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyCfclz44u-rYJpU2JC6csNRDLq75MQPgEU"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "packagingambassador.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "packagingambassador"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "packagingambassador.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "325035461503"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:325035461503:web:5ed00228a26c2f099ae84a"
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: "pk_test_f2bb436ef8143e33ca393282087ad0eee90d35cd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
