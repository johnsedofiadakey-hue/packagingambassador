# Firebase App Hosting runtime config.
# NEXT_PUBLIC_* values are the Firebase client SDK config — not secrets, safe
# to commit (this is the same config already shipped in every page's HTML).
#
# ARKESEL_API_KEY / BREVO_API_KEY are intentionally NOT declared here since
# no real values exist yet (see src/app/api/notifications/order-confirmation)
# — that channel no-ops without them. Once real keys exist, set them with
# `firebase apphosting:secrets:set ARKESEL_API_KEY` (and BREVO_API_KEY),
# then add matching `secret:` entries below. Never commit real key values to
# this file.
#
# PAYSTACK_SECRET_KEY follows the same pattern — server-only, set via
# `firebase apphosting:secrets:set PAYSTACK_SECRET_KEY` then a `secret:`
# entry below, never a plain `value:`. It currently exists only in
# .env.local for local dev (test keys). NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY is
# safe to commit as a plain `value:` like the Firebase config vars below
# once deploying for real.

runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCfclz44u-rYJpU2JC6csNRDLq75MQPgEU"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "packagingambassador.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "packagingambassador"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "packagingambassador.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "325035461503"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:325035461503:web:5ed00228a26c2f099ae84a"
    availability:
      - BUILD
      - RUNTIME

  # Paystack public key — safe to commit (it ships in the client bundle either
  # way). BUILD availability is required because it's baked into the browser
  # bundle at build time. Currently the TEST key; swap for the pk_live_* value
  # when going live (a new rollout re-bakes it).
  - variable: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
    value: "pk_test_f2bb436ef8143e33ca393282087ad0eee90d35cd"
    availability:
      - BUILD
      - RUNTIME

  # Paystack secret key — server-only. Never a plain value. Set the value with
  #   firebase apphosting:secrets:set PAYSTACK_SECRET_KEY
  # (paste the sk_test_* now; the sk_live_* later), then this reference injects
  # it at runtime for the verify + webhook routes.
  - variable: PAYSTACK_SECRET_KEY
    secret: PAYSTACK_SECRET_KEY
    availability:
      - RUNTIME

  # Brevo transactional-email API key — server-only. Set the value with
  #   firebase apphosting:secrets:set BREVO_API_KEY
  # Sends the branded order-confirmation email (src/lib/notifications).
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME
